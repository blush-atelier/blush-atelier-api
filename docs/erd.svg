<text x="20" y="42" font-family="sans-serif" font-size="25" fill="#352c30">Blush Atelier · PostgreSQL · carrito y pagos Sandbox</text>
<text x="20" y="78" font-family="sans-serif" font-size="15" fill="#76515d">Una transacción contiene varias líneas. Cada línea conserva cantidad y precio acordados.</text>
